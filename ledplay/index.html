<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposta LED PLAY · ajustada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Direção: painel de LED em desenho industrial. Papel de prancheta e grafite de chapa,
   amarelo de LED como acento, petróleo do fundo do painel como segunda cor do calendário.
   Um mundo visual só, sem tema escuro alternativo: as seções alternam papel e grafite. */
/* Fontes (Fontshare) em fonts/, ao lado deste arquivo: Clash Grotesk variável para títulos e destaques,
   Archivo variável para o texto corrido. Ficaram fora do HTML (base64 estourava a revisão do artifact). */
@font-face{font-family:"Clash Grotesk";src:url(fonts/ClashGrotesk-Variable.woff2) format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Archivo";src:url(fonts/Archivo-Variable.woff2) format("woff2");font-weight:100 900;font-display:swap}

:root{
  --paper:#FAF7EF; --paper-2:#F2EEE3; --line:#DDD8CB; --line-dark:#3A3633;
  --ink:#1E1C1A; --ink-2:#4A4642; --steel:#7A756D;
  --graphite:#252220; --on-dark:#F4F1E8; --on-dark-2:#B3ADA2;
  --led:#F2E27D; --led-deep:#E3CC45; --petrol:#1F4A55; --petrol-ink:#DDEBEE;
  --f-display:"Clash Grotesk","Archivo","Helvetica Neue",Arial,sans-serif;
  --f-sub:"Clash Grotesk","Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:clamp(16px,4vw,48px);
  --sec:clamp(64px,10vw,120px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
:focus-visible{outline:2px solid var(--led-deep);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.wrap{max-width:78rem;margin:0 auto;padding-inline:var(--gut)}
.sec{padding-block:var(--sec)}
.dark{background:var(--graphite);color:var(--on-dark)}
.tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);display:inline-flex;align-items:center;gap:10px}
.tag::before{content:"";width:8px;height:8px;background:currentColor}
.dark .tag{color:var(--on-dark-2)}
/* Título de seção: display em caixa alta, tamanho contido para não dominar a página. */
.h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.5rem,3.3vw,2.8rem);line-height:1.04;letter-spacing:-.005em}
/* Título misto: primeira linha em display, segunda em texto corrido. */
.h2-mix{display:grid;gap:8px}
.h2-mix .rest{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:clamp(1.15rem,1.9vw,1.55rem);line-height:1.3;color:var(--ink-2)}
.dark .h2-mix .rest{color:var(--on-dark-2)}
.lead{font-size:clamp(1.125rem,1.7vw,1.375rem);line-height:1.45;color:var(--ink-2);max-width:42ch}
.dark .lead{color:var(--on-dark-2)}
.head{display:grid;gap:18px;margin-bottom:clamp(36px,5vw,56px)}
@media (min-width:860px){.head.split{grid-template-columns:1fr 1fr;align-items:end}}
.mono-h{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:12px}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,247,239,.94);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(.72rem,2.4vw,.95rem);white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;text-decoration:none}

/* ---------- hero: o painel ---------- */
.hero{padding-block:clamp(28px,5vw,56px) var(--sec)}
.hero-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero-title{display:grid;gap:10px;margin-bottom:clamp(24px,3.5vw,40px)}
.hero-title .kick{font-family:var(--f-sub);font-weight:600;font-size:clamp(1rem,1.5vw,1.2rem);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.hero-title .big{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.5rem,3.3vw,2.8rem);line-height:1.04;letter-spacing:-.005em;max-width:22ch}
.panel{position:relative;background:var(--graphite);padding:clamp(10px,1.6vw,22px);border:1px solid #000;margin:0}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d877e,#3b3733 70%);top:clamp(2px,.4vw,7px)}
.panel::before{left:clamp(2px,.4vw,7px)}
.panel::after{right:clamp(2px,.4vw,7px)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#12100f;overflow:hidden}
.screen img{width:100%;height:100%;object-fit:cover}
/* Malha de LED só sobre a tela do painel na foto (cantos medidos no hero.jpg, 1280x720), não sobre a casa e o muro. */
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.16) 1px,transparent 1.2px);background-size:4px 4px;mix-blend-mode:multiply;clip-path:polygon(11.7% 36.4%,88.7% 21.9%,88.7% 73.3%,11.7% 75.7%)}
.panel-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2)}
.panel-foot .on{color:var(--led);display:inline-flex;align-items:center;gap:8px}
.panel-foot .on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led)}
.hero-body{display:grid;gap:32px;margin-top:clamp(36px,6vw,64px)}
@media (min-width:860px){.hero-body{grid-template-columns:1fr 1.15fr;align-items:start}}
.hero-body .lead{color:var(--ink);max-width:30ch}
.specs{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.specs li{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.specs li span{display:block;font-weight:600}
.specs li small{display:block;font-size:.9rem;color:var(--ink-2);line-height:1.45;margin-top:2px}
.specs b{font-family:var(--f-sub);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}

/* ---------- diagnóstico ---------- */
.faults{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));border-top:1px solid var(--line-dark);border-left:1px solid var(--line-dark)}
.fault{padding:28px 24px 32px;border-right:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);display:grid;gap:14px;align-content:start}
.fault .code{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--led)}
.fault h3{font-family:var(--f-sub);font-weight:600;font-size:1.15rem;line-height:1.2;text-transform:uppercase}
.fault p{color:var(--on-dark-2);font-size:1rem}

/* ---------- soluções ---------- */
.benefits{border-top:1px solid var(--ink)}
.benefit{display:grid;gap:12px 40px;padding-block:clamp(26px,3.5vw,40px);border-bottom:1px solid var(--line)}
@media (min-width:860px){.benefit{grid-template-columns:1fr 1.25fr;align-items:start}}
.benefit .ref{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:10px}
.benefit h3{font-family:var(--f-sub);font-weight:600;text-transform:uppercase;font-size:clamp(1.15rem,1.9vw,1.5rem);line-height:1.15;max-width:22ch}
.benefit p{color:var(--ink-2)}

/* ---------- calendário ---------- */
.why{display:grid;gap:clamp(28px,4vw,56px);margin-bottom:clamp(32px,4vw,48px)}
@media (min-width:960px){.why{grid-template-columns:1fr 1fr;align-items:start}}
.why-text{display:grid;gap:14px;color:var(--ink-2);max-width:56ch}
.why-text strong{color:var(--ink);font-weight:600}
.legend{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.legend li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.sw{font-family:var(--f-sub);font-weight:600;font-size:1rem;width:2.6rem;text-align:center;padding:4px 0;border:1px solid var(--ink);line-height:1.2}
.sw.vs{background:var(--led);color:var(--ink)}
.sw.ved{background:var(--petrol);color:var(--petrol-ink);border-color:var(--petrol)}
.sw.post{background:var(--paper);color:var(--ink)}
.legend h3{font-family:var(--f-body);font-weight:600;font-size:1rem;line-height:1.3}
.legend p{color:var(--ink-2);font-size:.95rem;margin-top:2px}

.cal-frame{background:var(--graphite);border:1px solid #000;padding:clamp(8px,1.2vw,14px)}
.cal-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 4px 12px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2)}
.cal-top .on{color:var(--led)}
/* Sempre uma grade de 7 colunas, como um calendário de parede: dias correm da esquerda
   para a direita e de cima para baixo. No celular a célula encolhe e esconde a pauta. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line-dark);border:1px solid var(--line-dark)}
.wd{background:var(--graphite);color:var(--on-dark-2);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 8px;text-align:center}
.wd.sat{color:var(--steel)}
.day{background:var(--paper);color:var(--ink);padding:10px 12px;display:grid;align-content:start;gap:8px;min-height:9.5rem}
.day .n{font-family:var(--f-sub);font-weight:600;font-size:1.15rem;line-height:1;font-variant-numeric:tabular-nums}
.day .chip{font-family:var(--f-sub);font-weight:600;font-size:.85rem;justify-self:start;padding:2px 9px;border:1px solid currentColor;line-height:1.2}
.day p{font-size:.8125rem;line-height:1.3}
.day.vs{background:var(--led)}
.day.ved{background:var(--petrol);color:var(--petrol-ink)}
.day.post{background:var(--paper)}
.day.off{background:repeating-linear-gradient(45deg,var(--paper-2) 0 7px,var(--line) 7px 8px);color:var(--steel)}
.day.pad{background:#2B2826}
@media (max-width:899px){
  .day{min-height:4.4rem;padding:6px 5px;gap:5px}
  .day .n{font-size:.9rem}
  .day .chip{font-size:.7rem;padding:1px 5px}
  .day p{display:none}
  .wd{padding:8px 2px;font-size:.55rem;letter-spacing:.04em}
}
.cal-note{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);margin-top:14px;max-width:90ch;line-height:1.6}

/* Destaque: anúncios. Eu faço, a verba de mídia fica fora do valor mensal.
   Mesmo desenho do card de valores: chapa grafite, tag mono, título em Clash, rodapé mono. */
.ads{margin-top:clamp(28px,4vw,48px);background:var(--graphite);color:var(--on-dark);border:1px solid #000;padding:clamp(22px,3.5vw,40px);display:grid;gap:14px 40px}
@media (min-width:860px){.ads{grid-template-columns:1fr 1.4fr;align-items:start}}
.ads .tag{grid-column:1/-1;color:var(--on-dark-2)}
.ads h3{font-family:var(--f-sub);font-weight:600;text-transform:uppercase;font-size:clamp(1.15rem,1.9vw,1.5rem);line-height:1.15;max-width:20ch;color:var(--on-dark)}
.ads p{color:var(--on-dark-2)}
.ads p + p{margin-top:10px}
.ads strong{color:var(--on-dark);font-weight:600}
.ads-foot{grid-column:1/-1;border-top:1px solid var(--line-dark);padding-top:12px;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2);line-height:1.6}
.ads-foot .on{color:var(--led)}

/* ---------- investimento ---------- */
.invest{display:grid;gap:clamp(16px,2vw,24px)}
@media (min-width:960px){.invest{grid-template-columns:1.25fr 1fr;align-items:start}}
.plan{background:var(--graphite);color:var(--on-dark);padding:clamp(24px,3.5vw,40px);display:grid;gap:24px;align-content:start;border:1px solid #000}
.plan .value{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1;color:var(--led);font-variant-numeric:tabular-nums;white-space:nowrap}
.plan .value small{font-family:var(--f-mono);font-size:.95rem;color:var(--on-dark-2);margin-left:8px;letter-spacing:.04em}
.plan .what{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2)}
.plan ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-dark)}
.plan li{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-dark)}
.plan li span{display:block;color:var(--on-dark);font-weight:500}
.plan li small{display:block;font-size:.875rem;color:var(--on-dark-2);margin-top:2px;line-height:1.45}
.plan li b{color:var(--led);font-family:var(--f-mono);font-weight:500;white-space:nowrap;padding-top:3px}
.plan .note{color:var(--on-dark-2);font-size:.95rem}
.plan .phase{display:grid;gap:14px;align-content:start}
.plan .phase + .phase{border-top:1px solid var(--on-dark-2);padding-top:24px}
.plan .value.v2{font-size:clamp(1.5rem,3.4vw,2.4rem)}
.plan .total{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--line-dark);padding-top:14px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2);line-height:1.6}
.plan .total b{color:var(--led);font-weight:500}

/* ---------- prioridades (contraproposta) ---------- */
.prio{border-top:1px solid var(--ink)}
.prio-row{display:grid;gap:10px 40px;padding-block:clamp(22px,3vw,34px);border-bottom:1px solid var(--line)}
@media (min-width:860px){.prio-row{grid-template-columns:1fr 1.25fr;align-items:start}}
.prio-row .ref{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:10px}
.prio-row h3{font-family:var(--f-sub);font-weight:600;text-transform:uppercase;font-size:clamp(1.1rem,1.8vw,1.4rem);line-height:1.15;max-width:24ch}
.prio-row p{color:var(--ink-2)}
.prio-row.later h3,.prio-row.later .ref{color:var(--steel)}
.prio-row .num{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--ink);border:1px solid var(--ink);padding:1px 8px;margin-right:8px;display:inline-block}
.prio-row.later .num{color:var(--steel);border-color:var(--steel)}
.dark .prio-row{border-bottom-color:var(--line-dark)}
.dark .prio-row h3{color:var(--on-dark)}
.dark .prio-row p{color:var(--on-dark-2)}
.dark .prio-row .ref{color:var(--on-dark-2)}
.dark .prio-row .num{color:var(--led);border-color:var(--led)}
.dark .prio-row.later h3,.dark .prio-row.later p,.dark .prio-row.later .ref{color:var(--steel)}
.dark .prio-row.later .num{color:var(--steel);border-color:var(--steel)}

/* ---------- site: segunda entrega ---------- */
.site-grid{display:grid;gap:clamp(28px,4vw,56px)}
@media (min-width:960px){.site-grid{grid-template-columns:1.2fr 1fr;align-items:start}}
.site-intro{display:grid;gap:18px;margin-bottom:clamp(28px,4vw,40px)}
.site-intro .lead{max-width:52ch}
.feat{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink);counter-reset:f}
.feat li{counter-increment:f;display:grid;grid-template-columns:2.4rem 1fr;gap:3px 12px;padding:15px 0;border-bottom:1px solid var(--line)}
.feat li::before{content:counter(f,decimal-leading-zero);font-family:var(--f-mono);font-size:.78rem;color:var(--steel);padding-top:5px;grid-row:span 2}
.feat h3{font-family:var(--f-body);font-weight:600;font-size:1.0625rem;line-height:1.3}
.feat p{color:var(--ink-2);font-size:.975rem}
.site-side{display:grid;gap:clamp(16px,2vw,24px)}
.preview{background:var(--graphite);border:1px solid #000;padding:clamp(8px,1.2vw,12px);margin:0}
.preview img{width:100%;height:auto;border:1px solid #000}
.preview figcaption{padding-top:8px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.preview figcaption .on{color:var(--led)}
/* Prévia ao vivo: o site da LED PLAY roda dentro do quadro (iframe embutido, modo demonstração:
   a intro toca sozinha em loop). Quadro em proporção de celular. No PDF vira o print. */
.preview-frame{position:relative;background:#080808;border:1px solid #000;aspect-ratio:9/15;max-height:680px;overflow:hidden;container-type:size}
/* a abertura do site roda aqui dentro, sem iframe: CSS e script dela entram no build com tudo escopado em .live */
.preview-frame .live{position:absolute;inset:0;overflow:hidden}
.preview-frame .live>main{height:100%}
.preview-frame .live .nav{position:absolute}
.preview-frame .poster{display:none}
.preview .prn{display:none}
.btn-site{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:var(--graphite);color:var(--on-dark);text-decoration:none;border:1px solid #000}
.btn-site b{display:block;font-family:var(--f-sub);font-weight:600;text-transform:uppercase;font-size:1.05rem;letter-spacing:.02em;line-height:1.2}
.btn-site small{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);margin-top:4px;line-height:1.5}
.btn-site .arr{font-family:var(--f-sub);font-weight:600;font-size:1.4rem;color:var(--led);flex:none}
.offer{background:var(--graphite);color:var(--on-dark);border:1px solid #000;padding:clamp(24px,3.5vw,40px);display:grid;gap:20px;align-content:start}
.offer .value{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1;color:var(--led);white-space:nowrap}
.offer .value small{font-family:var(--f-mono);font-size:.9rem;color:var(--on-dark-2);margin-left:8px;letter-spacing:.04em}
.offer ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-dark)}
.offer li{padding:12px 0;border-bottom:1px solid var(--line-dark);color:var(--on-dark-2);display:grid;gap:2px;font-size:.975rem}
.offer li b{color:var(--on-dark);font-weight:600;font-size:1.0625rem}
.offer .fomo{font-family:var(--f-sub);font-weight:600;text-transform:uppercase;font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.3;color:var(--led)}
.offer .was{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);margin-bottom:-10px}
.offer .was s{text-decoration-thickness:1px}
.offer .note{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);line-height:1.6}

/* ---------- impressão: PDF no formato da tela do iPhone ----------
   Uma página = uma tela (393 x 852 px). O conteúdo corre contínuo, como o scroll do
   celular; os blocos abaixo não podem ser cortados entre duas páginas. */
@page{size:393px 852px;margin:0}
@media print{
  html,body{background:var(--paper)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top{position:static}
  h1,h2,h3,.tag,.mono-h,.head,.hero-head,.hero-title{break-after:avoid}
  .head,.hero-title,.site-intro,.prio-row,.phase,.hero-body p,.why-text p,.panel,.fault,.benefit,.legend li,.specs li,.plan li,.feat li,.cal-frame,.ads,.preview,.offer,.close,.foot{break-inside:avoid}
  .panel-foot .on::before{box-shadow:none}
  .preview-frame{aspect-ratio:auto;max-height:none;container-type:normal}
  .preview-frame .live{display:none}
  .preview-frame .poster{display:block;width:100%;height:auto}
  .btn-site{display:none}
  .preview .scr{display:none}
  .preview .prn{display:inline}
  /* o card de valores é mais alto que uma tela: fica compacto e pode continuar na página seguinte */
  .plan{padding:22px;gap:16px}
  .plan li{padding:9px 0}
}

/* ---------- fechamento ---------- */
.close{display:grid;gap:28px;justify-items:start}
.close .h2{max-width:18ch}
.foot{border-top:1px solid var(--line-dark);margin-top:clamp(56px,8vw,96px);padding-top:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2)}

/* ---------- contraproposta: bloco 1, bloco 2 e site, três coisas separadas ---------- */
@media print{#investimento{break-before:page;padding-top:24px!important}.blk-head,.blk li,.calbox,.cal-mini,.key,.cal-count,.tiles,.site-card{break-inside:avoid}.site-sec{break-before:page}}
.blk,.site-card{display:block;background:var(--graphite);color:var(--on-dark);border:1px solid #000;padding:clamp(24px,3.5vw,40px)}
.blk+.blk{margin-top:clamp(28px,4vw,44px)}
.blk>*+*{margin-top:16px}
.blk>ul+*{margin-top:22px}
.blk>.blk-head+.what{margin-top:26px}
.blk-head>*+*{margin-top:8px}
.blk-head .value,.site-card .value{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1;color:var(--led);font-variant-numeric:tabular-nums;white-space:nowrap;margin:0}
.blk-head .value small,.site-card .value small{font-family:var(--f-mono);font-size:.95rem;color:var(--on-dark-2);margin-left:8px;letter-spacing:.04em;font-weight:400}
.blk-head .when{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2);line-height:1.6}
.blk-head .delta{display:inline-block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--led);padding:2px 9px}
.blk ul,.site-card ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-dark)}
.blk li,.site-card li{display:block;padding:12px 0;border-bottom:1px solid var(--line-dark)}
.blk li span,.site-card li span{display:block;color:var(--on-dark);font-weight:500}
.blk li small,.site-card li small{display:block;font-size:.875rem;color:var(--on-dark-2);margin-top:2px;line-height:1.45}
.blk li b{color:var(--led);font-family:var(--f-mono);font-weight:500;white-space:nowrap;padding-top:3px}
.blk .li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.blk li.absent span{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--led);color:var(--on-dark-2);font-weight:400}
.blk li.absent b{color:var(--on-dark-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.new-tag{display:inline-block!important;margin-left:8px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)!important;background:var(--led);padding:1px 6px;vertical-align:2px;font-weight:500}
.what{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark-2);display:block}
.tiles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.tile{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--led);color:var(--ink);border:1px solid var(--led)}
.tile svg{display:block;width:72%;height:72%}
.tile.v,.tile.ad{width:38px;height:22px}
.tile.a{width:20px;height:32px}
.tile.c{width:26px;height:26px}
.tile.new{background:var(--paper);border-color:var(--paper)}
.tile.gone{background:transparent;color:#6b665e;border:1px dashed #6b665e}
.calbox>*+*{margin-top:14px}
.cal-mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-mini .wd{background:transparent;padding:4px 0;font-size:.6rem;letter-spacing:.04em}
.cal-mini .day{min-height:0;aspect-ratio:1/1;padding:4px;gap:2px;align-content:space-between}
.cal-mini .day .n{font-size:.72rem;font-weight:500}
.cal-mini .day .chip{font-size:.62rem;padding:0 4px;line-height:1.3}
.cal-mini .day.gone{background:#38342f;color:#6b665e}
.cal-mini .day.gone .chip{border-style:dashed}
.cal-mini .day.adv{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--led)}
.cal-mini .day.off{background:transparent;border:1px solid #2f2b28}
.cal-mini .day.pad{background:transparent}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2)}
.key i{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;border:1px solid transparent}
.cal-count{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--on-dark);line-height:1.2;margin:0}
.cal-count b{color:var(--led)}
.cal-count s{color:#6b665e;font-weight:400;text-decoration-color:var(--led)}
.cal-count em{font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--led);padding:1px 7px;margin-left:6px;vertical-align:2px}
.site-sec{margin-top:clamp(64px,9vw,112px)}
.site-card>*+*{margin-top:18px}
.site-card .was{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2)}
.valid{margin-top:clamp(40px,6vw,64px);display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
</style>

<header class="top">

  </div>
</header>

<main id="inicio">

  <section class="hero wrap" aria-labelledby="t-hero" style="padding-bottom:clamp(40px,6vw,72px)">
    <div class="hero-head">
      <span class="tag">Proposta · LED PLAY</span>
      <span class="tag">Dourados, MS · 26 de setembro de 2026</span>
    </div>
    <h1 id="t-hero" class="hero-title">
      <span class="big">Fazer a LED PLAY ser</span>
      <span class="kick">destaque e referência no mercado de LED</span>
    </h1>
    <figure class="panel">
      <div class="screen">
        <img src="hero.jpg" alt="Simulação de anúncio 3D no painel da LED PLAY no final da Monte Alegre, em Dourados: uma Toyota Hilux enlameada sai da tela entre a mata, ao lado da frase Força de verdade" width="1280" height="720">
      </div>
      <figcaption class="panel-foot">
        <span class="on">Painel LED PLAY · em exibição</span>
        <span>Simulação de anúncio 3D</span>
      </figcaption>
    </figure>
  </section>

  <section class="sec" style="background:var(--paper-2);padding-top:clamp(40px,6vw,72px)" id="investimento" aria-labelledby="t-serv">
    <div class="wrap">
      <div class="head">
        <span class="tag">Serviço prestado</span>
        <h2 id="t-serv" class="h2">Instagram da LED PLAY</h2>
      </div>
      <div class="blocks">
        <article class="blk" id="blk1"></article>
        <article class="blk" id="blk2"></article>
      </div>

      <div class="site-sec">
        <div class="head">
          <span class="tag">Segunda entrega · à parte</span>
          <h2 class="h2">Site da LED PLAY</h2>
        </div>
        <article class="site-card" id="site-card"></article>
      </div>

      <p class="valid" id="valid"></p>
    </div>
  </section>

</main>

<script>
  // ---------- DADOS ----------
  // Preços do cliente (mensagem de 26/09). A entrega dos blocos foi dimensionada pelo pacote original de R$ 4.535
  // (pesos: vídeo profissional 3, vídeo de anúncio 2,5, acervo 1, post 1, consultoria 5, leitura 1 = ~R$ 93 por peso):
  // bloco 1 = 22 pesos (~R$ 2.057), bloco 2 = 31 pesos (~R$ 2.899).
  const ORIG = Object.freeze({ vs: 5, ved: 13, post: 8, ads: 3 });
  const ORIG_WEEK = Object.freeze(["ved", "vs", "post", "ved", "post", null, "ved"]);
  const DAYS_IN_MONTH = 30;
  // Seg acervo (semanas 1 a 4), ter vídeo de estúdio (semanas 1, 3 e 5), qua e sex post.
  const typeFor = (wd, week) => wd === 0 ? (week < 4 ? "ved" : null) : wd === 1 ? (week % 2 === 0 ? "vs" : null) : (wd === 2 || wd === 4) ? "post" : null;
  const COUNT = Array.from({ length: DAYS_IN_MONTH }, (_, i) => typeFor(i % 7, Math.floor(i / 7)))
    .reduce((c, t) => { if (t) c[t]++; return c; }, { vs: 0, ved: 0, post: 0 });
  // Bloco 2: os 2 vídeos de anúncio entram nas quintas (dias 11 e 25), que ficam em branco no bloco 1.
  const AD_DAYS = Object.freeze([11, 25]);

  const B1 = Object.freeze({
    n: 1, price: 2000, months: 4, from: 1,
    items: [
      { key: "vs", label: "Vídeos profissionais gravados por mim", have: COUNT.vs, orig: ORIG.vs, desc: "Câmera e luz de estúdio, gravados em um único dia." },
      { key: "post", label: "Posts estáticos ou carrossel", have: COUNT.post, orig: ORIG.post, desc: "Respondem as dúvidas de compra e pedem pergunta nos comentários." },
      { key: "ved", label: "Vídeos curtos editados", have: COUNT.ved, orig: ORIG.ved, desc: "Acervo gravado no iPhone, editado por mim." },
      { key: "ads", label: "Vídeos voltados para anúncio", have: 0, orig: ORIG.ads, absent: true, tag: "mês 5" },
      { key: null, label: "Leitura de comentários e métricas", text: "mensal", desc: "O que gerou conversa vira a pauta seguinte." },
      { key: null, label: "Consultoria publicitária", absent: true, tag: "mês 5" }
    ]
  });
  // Os R$ 800 a mais pagam a camada de anúncio: 2 vídeos e a consultoria. O resto segue igual ao bloco 1.
  const B2 = Object.freeze({
    n: 2, price: 2800, months: 8, from: 5,
    items: [
      { key: "vs", label: "Vídeos profissionais gravados por mim", have: COUNT.vs, orig: ORIG.vs, desc: "Igual ao bloco 1." },
      { key: "post", label: "Posts estáticos ou carrossel", have: COUNT.post, orig: ORIG.post, desc: "Igual ao bloco 1." },
      { key: "ved", label: "Vídeos curtos editados", have: COUNT.ved, orig: ORIG.ved, desc: "Igual ao bloco 1." },
      { key: "ads", label: "Vídeos voltados para anúncio", have: AD_DAYS.length, orig: ORIG.ads, isNew: true, desc: "Feitos para rodar como anúncio pago." },
      { key: null, label: "Consultoria publicitária", text: "mensal", isNew: true, desc: "Análise das métricas e direção dos anúncios." }
    ],
    note: "A verba dos anúncios é um investimento à parte, pago direto à plataforma."
  });
  const SITE = Object.freeze({ price: 1386, was: 2235, points: ["Pago uma única vez", "Cada alteração depois da entrega é cobrada como taxa de manutenção"] });
  const VALID = Object.freeze({ term: 12, days: 15, until: "11 de outubro de 2026" });

  // ---------- LÓGICA ----------
  const esc = v => String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
  const brl = n => "R$ " + new Intl.NumberFormat("pt-BR").format(n);
  const ICON = {
    v: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    ad: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    a: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10.5 19h3"/></svg>',
    c: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="3" y="6" width="14" height="13" rx="1.5"/><path d="M20 8v9"/></svg>'
  };
  const CLS = { vs: "v", ved: "a", post: "c", ads: "ad" };
  const tile = (key, mod) => `<span class="tile ${CLS[key]}${mod ? " " + mod : ""}">${ICON[CLS[key]]}</span>`;
  // amarelo = entra, branco = entra só neste bloco, cinza tracejado = estava no pacote de R$ 4.535 e não entra
  const tiles = it => {
    if (!it.key) return "";
    const gone = Math.max(0, it.orig - it.have);
    const html = Array.from({ length: it.have }, () => tile(it.key, it.isNew ? "new" : "")).join("") +
                 Array.from({ length: gone }, () => tile(it.key, "gone")).join("");
    return html ? `<div class="tiles" role="img" aria-label="${it.have} entram, ${gone} ficam de fora">${html}</div>` : "";
  };
  const row = it => {
    const count = it.absent ? esc(it.tag) : esc(it.text ?? it.have);
    const badge = it.isNew ? `<i class="new-tag" style="font-style:normal">novo</i>` : "";
    const desc = it.desc ? `<small>${esc(it.desc)}</small>` : "";
    return `<li class="${it.absent ? "absent" : ""}"><div class="li-top"><div><span>${esc(it.label)}${badge}</span>${desc}</div><b>${count}</b></div>${tiles(it)}</li>`;
  };

  // Calendário: colorido = entra, cinza = estava na proposta anterior e não entra, listrado = em branco, contorno amarelo = novo.
  const WD = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
  const CHIP = { vs: "V", ved: "A", post: "C" };
  const calendar = withAds => {
    const days = Array.from({ length: DAYS_IN_MONTH }, (_, i) => ({ n: i + 1, now: typeFor(i % 7, Math.floor(i / 7)), was: ORIG_WEEK[i % 7] }));
    const nNow = days.filter(d => d.now).length, nWas = days.filter(d => d.was).length;
    const count = withAds
      ? `<b>${nNow + AD_DAYS.length}</b> publicações no mês <em>${AD_DAYS.length} novas</em>`
      : `<b>${nNow}</b> publicações no mês <s>${nWas}</s>`;
    const cells = days.map(d => {
      const n = `<span class="n">${String(d.n).padStart(2, "0")}</span>`;
      if (withAds && AD_DAYS.includes(d.n)) return `<div class="day adv" role="listitem" aria-label="Dia ${d.n}, vídeo de anúncio, novo">${n}<span class="chip">AD</span></div>`;
      if (d.now) return `<div class="day ${d.now}" role="listitem" aria-label="Dia ${d.n}, entra">${n}<span class="chip">${CHIP[d.now]}</span></div>`;
      if (d.was) return `<div class="day gone" role="listitem" aria-label="Dia ${d.n}, não entra">${n}<span class="chip">${CHIP[d.was]}</span></div>`;
      return `<div class="day off" role="listitem" aria-label="Dia ${d.n}, em branco">${n}</div>`;
    }).join("");
    const pad = Array.from({ length: (7 - (DAYS_IN_MONTH % 7)) % 7 }, () => `<div class="day pad" aria-hidden="true"></div>`).join("");
    const key = `<span><i style="background:var(--led)"></i>V estúdio</span><span><i style="background:var(--petrol)"></i>A acervo</span><span><i style="background:var(--paper)"></i>C post</span>` +
      (withAds ? `<span><i style="background:var(--paper);box-shadow:inset 0 0 0 2px var(--led)"></i>AD anúncio, novo</span>` : "") +
      `<span><i style="background:#38342f;border:1px dashed #6b665e"></i>não entra</span>`;
    return `<div class="calbox"><span class="what">Planejamento do mês</span><p class="cal-count">${count}</p>
      <div class="cal-mini" role="list" aria-label="Calendário de 30 dias">${WD.map(w => `<div class="wd" aria-hidden="true">${w}</div>`).join("")}${cells}${pad}</div>
      <div class="key">${key}</div></div>`;
  };

  const block = (b, withAds) => {
    const to = b.from + b.months - 1;
    const delta = b.n === 2 ? `<span class="delta">+ ${brl(B2.price - B1.price)} por mês</span>` : "";
    const note = b.note ? `<p class="what" style="text-transform:none;letter-spacing:.02em;font-family:var(--f-body);font-size:.95rem">${esc(b.note)}</p>` : "";
    return `<div class="blk-head"><span class="tag">Bloco ${b.n} · meses ${b.from} a ${to}</span>
        <p class="value">${brl(b.price)}<small>/mês</small></p>${delta}</div>
      <span class="what">${b.n === 1 ? "O que está incluso" : "O que muda"}</span>
      <ul>${b.items.map(row).join("")}</ul>${calendar(withAds)}${note}`;
  };

  // ---------- RENDER ----------
  document.getElementById("blk1").innerHTML = block(B1, false);
  document.getElementById("blk2").innerHTML = block(B2, true);
  document.getElementById("site-card").innerHTML =
    `<span class="was">Valor único</span><p class="value">${brl(SITE.price)}<small>uma vez</small></p>
     <ul>${SITE.points.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ul>`;
  document.getElementById("valid").innerHTML = `<span>Prazo do Instagram: ${VALID.term} meses</span><span>Validade da proposta: ${VALID.days} dias, até ${esc(VALID.until)}</span>`;
</script>
